<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Formulario completo</title>
    <link rel="stylesheet" href="estiloformularios.css">
</head>
<body>

<form class="formulario">
    <h1>Formulario</h1>
    <label for="nombre">Nombre:</label>
    <br>
    <input type="text" required name="nombre" id="nombre">
    <br>
    <label for="apellido">Apellido:</label>
    <br>
    <input type="text"  required name="apellido" id="apellido">
    <br>
    <label for="email">Email:</label>
    <br>
    <input type="text" required name="email" id="email">
    <br>
    <label for="contrasena">Contraseña:</label>
    <br>
    <input type="password" required name="contrasena" id="contrasena">
    <br>
    <label for="repcontrasena">Repetir contraseña:</label>
    <br>
    <input type="password"  required  name="contrasena" id="repcontrasena">
    <br><br>
    <input type="checkbox" required value="aceptado" name="terminos" id="terminos">
    <label for="terminos">Acepto los términos y condiciones</label>
    <br><br>
    <input type="submit" value="Registrar">
</form>

</body>
</html>
